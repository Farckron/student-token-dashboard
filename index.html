<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Token Dashboard</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5b6470;
    --border: #d9dde3; --accent: #2f6fde; --accent-text: #ffffff;
    --ok: #18794e; --warn: #9a6700; --err: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --card: #1a1f25; --text: #e6e9ed; --muted: #9aa4b0;
      --border: #2c333c; --accent: #5b93f5; --accent-text: #0b0e12;
      --ok: #4cc38a; --warn: #e0b341; --err: #ff6b6b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.5rem; margin: 8px 0 4px; }
  h2 { font-size: 1.1rem; margin: 0 0 8px; }
  p { margin: 4px 0; }
  a { color: var(--accent); }
  .muted { color: var(--muted); font-size: 0.9rem; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; margin: 12px 0;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .grid .card { margin: 0; }
  .big { font-size: 1.4rem; font-weight: 600; }
  .addr, .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.85rem; overflow-wrap: anywhere; }
  button {
    font: inherit; padding: 8px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text);
  }
  button.secondary { background: transparent; color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  input, select {
    font: inherit; width: 100%; max-width: 100%; padding: 8px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text);
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .error { color: var(--err); font-size: 0.9rem; display: block; min-height: 1.2em; }
  .warn { color: var(--warn); }
  .ok { color: var(--ok); }
  .bad { color: var(--err); }
  #status { overflow-wrap: anywhere; }
  #lecturerBtn { margin-top: 8px; text-align: left; overflow-wrap: anywhere; }
  footer { margin: 24px 0; }
</style>
</head>
<body>
<main>
  <h1>Student Token Dashboard</h1>
  <p class="muted">Group 3 assignment: two ERC-20 tokens on Ethereum Sepolia.</p>

  <section class="card">
    <div class="row">
      <button id="connectBtn" type="button">Connect Wallet</button>
      <button id="switchBtn" type="button" class="secondary" hidden>Switch to Sepolia</button>
    </div>
    <p>Account: <span id="account" class="addr">not connected</span></p>
    <p id="walletMsg"></p>
    <p id="chainMsg" aria-live="polite"></p>
  </section>

  <section class="grid" id="tokens" aria-label="Token balances"></section>

  <section class="card">
    <h2>Send tokens</h2>
    <form id="sendForm" novalidate>
      <label for="tokenSelect">Token</label>
      <select id="tokenSelect"></select>

      <label for="recipient">Destination address</label>
      <input id="recipient" type="text" autocomplete="off" spellcheck="false" placeholder="0x..." aria-describedby="recipientErr">
      <span class="error" id="recipientErr" aria-live="polite"></span>
      <button id="lecturerBtn" type="button" class="secondary">
        Fill lecturer address: <span class="mono" id="lecturerAddr"></span>
      </button>

      <label for="amount">Amount</label>
      <input id="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="1.0" aria-describedby="amountErr">
      <span class="error" id="amountErr" aria-live="polite"></span>

      <button id="sendBtn" type="submit" disabled>Send</button>
    </form>
    <p id="status" aria-live="polite"></p>
  </section>

  <footer class="muted">
    Testnet only (Sepolia). These tokens have no monetary value.
    This page never asks for a private key or seed phrase.
  </footer>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
